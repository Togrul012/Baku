<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Красивые места Баку</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            color: #333;
            text-align: center;
        }
        header {
            background: #008080;
            color: white;
            padding: 20px 0;
        }
        section {
            margin: 20px;
        }
        img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <header>
        <h1>Bakıya xoş gəlmisiz</h1>
        <p>Bakının ən gözəl yerlərini ac</p>
    </header>

    <section>
        <h2>Alov gülləsi</h2>
        <img src="flame_towers.jpg" alt="Alov gülləsi">
        <p>Şəhərin müasir simvolu gecələr gözəl işıqlandırılırlar</p>
    </section>

    <section>
        <h2>Primorsky bulvarı</h2>
        <img src="primorskiy-bulvar-baku.jpg" alt="Primorsky bulvarı">
        <p>Xəzər dənizi sahilində gəzinti üçün ideal yerdir</p>
    </section>

    <section>
        <h2>İçəri Şəhər</h2>
        <img src="image202.jpg" alt="İçəri Şəhər">
        <p>Dar küçələri və qədim tikililəri olan Bakının tarixi ürəyi</p>
    </section>
</body>
</html>
